# dccd — example configuration (v3)
#
# Copy this file, adapt it to your setup, and pass it to dccd:
#   dccd validate --config config.yml    # check without running
#   dccd backfill --config config.yml    # run every configured backfill job once
#   dccd start    --config config.yml    # full daemon (scheduler + streams + UI)
#   dccd ui       --config config.yml    # web UI only (monitoring/control)


# ---------------------------------------------------------------------------
# Settings  (optional — all keys have defaults)
# ---------------------------------------------------------------------------
settings:
  data_path: ./data/crypto     # root directory for all local data files
  timezone: local              # 'local', 'UTC', or an IANA name (Europe/Paris)

  # Web UI (dccd ui / embedded in dccd start). Requires: pip install dccd[daemon]
  ui_host: 127.0.0.1           # bind address; use 0.0.0.0 to expose on the LAN
  ui_port: 8080                # TCP port for the web UI
  ui_auth_token: null          # Bearer token required to access /api/*; null
                               # disables auth (fine for a local 127.0.0.1 bind).
                               # Set a token before exposing on a network.
  # ui_allow_origins: []       # CORS allow-list (never wildcard)


# ---------------------------------------------------------------------------
# Jobs  — one list; each entry is routed by `operation` + `trigger_kind`.
#
#   data_type:    ohlc | trades | orderbook
#   operation:    backfill (REST history) | stream (live WebSocket)
#   trigger_kind: interval | cron  (recurring backfill)
#                 supervised       (long-running stream worker)
#                 once             (one-shot backfill)
#   span:         candle size in seconds — required for ohlc backfills
#   start:        'last' (resume), 'origin' (full history), or an ISO date
#
# OHLC is collected via scheduled backfills; trades/order books via streams.
# Files land under:
#   {data_path}/{exchange}/ohlc/{pair}/{span}/YYYY.parquet      (annual)
#   {data_path}/{exchange}/trades/{pair}/YYYY-MM-DD.parquet     (daily)
#   {data_path}/{exchange}/orderbook/{pair}/YYYY-MM-DD.parquet  (daily)
# ---------------------------------------------------------------------------
jobs:

  # Hourly BTC/USDT + ETH/USDT OHLC, refreshed every hour.
  - exchange: binance          # binance, kraken, bybit, okx, coinbase, bitfinex, bitmex
    pairs:
      - BTC/USDT               # 'CRYPTO/FIAT' format
      - ETH/USDT
    data_type: ohlc
    span: 3600                 # candle interval in seconds (>= 60)
    operation: backfill
    trigger_kind: interval
    every: 3600                # re-run every 3600 s
    start: last                # resume from the last stored bar

  # Daily BTC/USD OHLC from Kraken.
  - exchange: kraken
    pairs:
      - BTC/USD
    data_type: ohlc
    span: 86400                # daily candles
    operation: backfill
    trigger_kind: interval
    every: 86400

  # Live trade collection (WebSocket stream, supervised / auto-reconnect).
  - exchange: kraken
    pairs:
      - BTC/USD
    data_type: trades
    operation: stream
    trigger_kind: supervised

  # Live order-book snapshots every 60 s.
  # - exchange: binance
  #   pairs:
  #     - BTC/USDT
  #   data_type: orderbook
  #   operation: stream
  #   trigger_kind: supervised
  #   depth: 20                # number of price levels per side
  #   snapshot_interval: 60    # seconds between persisted snapshots


# ---------------------------------------------------------------------------
# Storage  (optional)  — push the local Parquet store to off-box remotes.
#
# Requires rclone (https://rclone.org) installed on the host and named remotes
# configured with `rclone config`. Remove this block to keep data local only.
# ---------------------------------------------------------------------------
storage:
  remotes:
    - provider: rclone
      remote: "mynas:crypto/"        # primary destination (NAS / Freebox)
    # - provider: rclone
    #   remote: "s3:mybucket/crypto/"  # secondary destination (S3 backup)
  sync_interval: 3600          # seconds between sync cycles (0 = disable)


# ---------------------------------------------------------------------------
# Alerts  (optional)  — webhook fired after repeated job failures.
# ---------------------------------------------------------------------------
# alerts:
#   webhook_url: "https://hooks.slack.com/services/T.../B.../..."
#   max_consecutive_errors: 3  # alert after N consecutive failures
