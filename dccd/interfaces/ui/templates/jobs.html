{% extends "base.html" %}
{% block title %}Jobs{% endblock %}
{% block content %}
<h1>Jobs</h1>
<p class="muted">Configured job specs from config.yml. Edit the Config page to add or remove jobs.</p>

<div id="jobs-content"><span class="muted">Loading…</span></div>
{% endblock %}
{% block scripts %}
<script>
async function loadJobs() {
  try {
    const { jobs } = await api('GET', '/api/jobs');
    if (!jobs.length) {
      document.getElementById('jobs-content').innerHTML = '<span class="muted">No jobs configured.</span>';
      return;
    }

    const backfillJobs = jobs.filter(j => j.operation === 'backfill');
    const streamJobs   = jobs.filter(j => j.operation === 'stream');

    let html = '';

    if (backfillJobs.length) {
      html += '<h2>Backfill / Update jobs</h2>';
      html += '<table><thead><tr><th>Exchange</th><th>Symbol</th><th>Type</th><th>Span</th><th>Trigger</th><th>Enabled</th></tr></thead><tbody>';
      for (const j of backfillJobs) {
        html += `<tr>
          <td>${escapeHtml(j.exchange)}</td>
          <td>${escapeHtml(j.symbol)}</td>
          <td>${escapeHtml(j.data_type)}</td>
          <td>${j.span ?? '-'}</td>
          <td>${escapeHtml(j.trigger)}</td>
          <td>${j.enabled ? '<span class="ok">✓</span>' : '<span class="muted">✗</span>'}</td>
        </tr>`;
      }
      html += '</tbody></table>';
    }

    if (streamJobs.length) {
      html += '<h2>Stream jobs</h2>';
      html += '<table><thead><tr><th>Exchange</th><th>Symbol</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody>';
      for (const j of streamJobs) {
        const running = j.running;
        html += `<tr>
          <td>${escapeHtml(j.exchange)}</td>
          <td>${escapeHtml(j.symbol)}</td>
          <td>${escapeHtml(j.data_type)}</td>
          <td><span class="${running ? 'ok' : 'muted'}">${running ? 'Running' : 'Stopped'}</span></td>
          <td>
            ${running
              ? `<button class="ghost danger" style="font-size:.8rem" onclick='stopStream(${attrJson(j.id)})'>Stop</button>`
              : `<button style="font-size:.8rem" onclick='startStream(${attrJson(j.id)})'>Start</button>`
            }
          </td>
        </tr>`;
      }
      html += '</tbody></table>';
    }

    document.getElementById('jobs-content').innerHTML = html;
  } catch (e) {
    document.getElementById('jobs-content').innerHTML = `<span class="err">${escapeHtml(e.message)}</span>`;
  }
}

async function startStream(specId) {
  try {
    await api('POST', '/api/streams/start', { spec_id: specId });
    toast('Stream started', 'ok');
    setTimeout(loadJobs, 500);
  } catch (e) {
    toast(e.message, 'err');
  }
}

async function stopStream(specId) {
  try {
    await api('POST', '/api/streams/stop', { spec_id: specId });
    toast('Stream stopped', 'ok');
    setTimeout(loadJobs, 500);
  } catch (e) {
    toast(e.message, 'err');
  }
}

loadJobs();
setInterval(loadJobs, 10000);
</script>
{% endblock %}
