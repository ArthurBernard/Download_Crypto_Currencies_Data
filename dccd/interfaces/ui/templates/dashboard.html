{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h1>Dashboard</h1>

<div class="row" style="gap:1rem;align-items:flex-start">
  <!-- Recent runs -->
  <div class="card" style="flex:2;min-width:280px">
    <h2 style="margin-top:0">Recent runs</h2>
    <div id="runs-body"><span class="muted">Loading…</span></div>
  </div>

  <!-- Streams -->
  <div class="card" style="flex:1;min-width:200px">
    <h2 style="margin-top:0">Streams</h2>
    <div id="streams-body"><span class="muted">Loading…</span></div>
  </div>
</div>

<!-- Inventory summary -->
<div class="card" style="margin-top:.5rem">
  <h2 style="margin-top:0">Datasets</h2>
  <div id="inv-body"><span class="muted">Loading…</span></div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function load() {
  // Runs
  try {
    const { runs } = await api('GET', '/api/runs?limit=20');
    const tbody = runs.length ? runs.map(r => {
      const stateColor = r.state === 'succeeded' ? 'ok' : r.state === 'failed' ? 'err' : '';
      return `<tr>
        <td><span class="muted" style="font-size:.8em;font-family:monospace">${escapeHtml(r.operation)} ${escapeHtml(r.exchange)} ${escapeHtml(r.symbol)}</span></td>
        <td class="${stateColor}">${escapeHtml(r.state)}</td>
        <td>${r.rows_written ?? 0}</td>
        <td class="muted">${fmtNs(r.started_at)}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="4" class="muted">No runs yet</td></tr>';
    document.getElementById('runs-body').innerHTML =
      `<table><thead><tr><th>Job</th><th>State</th><th>Rows</th><th>Started</th></tr></thead><tbody>${tbody}</tbody></table>`;
  } catch (e) { document.getElementById('runs-body').innerHTML = `<span class="err">${escapeHtml(e.message)}</span>`; }

  // Streams
  try {
    const { streams } = await api('GET', '/api/streams');
    if (!streams.length) {
      document.getElementById('streams-body').innerHTML = '<span class="muted">No stream jobs</span>';
    } else {
      document.getElementById('streams-body').innerHTML = streams.map(s =>
        `<div class="row" style="margin:.3rem 0">
          <span class="${s.running ? 'ok' : 'muted'}">●</span>
          <span style="font-size:.85em">${escapeHtml(s.id.split(':').slice(1,3).join(' '))}</span>
        </div>`
      ).join('');
    }
  } catch (e) { document.getElementById('streams-body').innerHTML = `<span class="err">${escapeHtml(e.message)}</span>`; }

  // Inventory
  try {
    const { datasets } = await api('GET', '/api/inventory');
    if (!datasets.length) {
      document.getElementById('inv-body').innerHTML = '<span class="muted">No datasets stored yet. Run a backfill to get started.</span>';
    } else {
      // Group by exchange
      const byExchange = {};
      for (const d of datasets) {
        if (!byExchange[d.exchange]) byExchange[d.exchange] = [];
        byExchange[d.exchange].push(d);
      }
      let html = '';
      for (const [ex, ds] of Object.entries(byExchange)) {
        html += `<h3 style="margin:.8rem 0 .3rem;font-size:.9rem;color:var(--muted);text-transform:uppercase">${escapeHtml(ex)}</h3>`;
        html += `<table><thead><tr><th>Pair</th><th>Type</th><th>Span</th><th>Files</th></tr></thead><tbody>`;
        for (const d of ds) {
          html += `<tr>
            <td>${escapeHtml(d.pair)}</td>
            <td>${escapeHtml(d.data_type)}</td>
            <td>${d.span ?? '-'}</td>
            <td>${d.files}</td>
          </tr>`;
        }
        html += `</tbody></table>`;
      }
      document.getElementById('inv-body').innerHTML = html;
    }
  } catch (e) { document.getElementById('inv-body').innerHTML = `<span class="err">${escapeHtml(e.message)}</span>`; }
}

load();
setInterval(load, 15000);
</script>
{% endblock %}
