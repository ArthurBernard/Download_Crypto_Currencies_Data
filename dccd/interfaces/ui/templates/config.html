{% extends "base.html" %}
{% block title %}Config{% endblock %}
{% block content %}
<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:.5rem">
  <h1 style="margin:0">Config</h1>
  <div class="row" style="gap:.5rem">
    <button onclick="saveConfig()">Save</button>
    <span id="save-status" style="font-size:.85rem"></span>
  </div>
</div>
<p class="muted">Edit the raw YAML-equivalent config as JSON. Changes are written to disk when a config path is set.</p>

<textarea id="cfg-editor" spellcheck="false"></textarea>
{% endblock %}
{% block scripts %}
<script>
async function loadConfig() {
  try {
    const cfg = await api('GET', '/api/config');
    document.getElementById('cfg-editor').value = JSON.stringify(cfg, null, 2);
  } catch (e) {
    document.getElementById('cfg-editor').value = '// Error loading config: ' + e.message;
  }
}

async function saveConfig() {
  const el = document.getElementById('save-status');
  el.textContent = '';
  let cfg;
  try {
    cfg = JSON.parse(document.getElementById('cfg-editor').value);
  } catch (e) {
    el.innerHTML = '<span class="err">Invalid JSON: ' + escapeHtml(e.message) + '</span>';
    return;
  }
  try {
    await api('PUT', '/api/config', cfg);
    el.innerHTML = '<span class="ok">Saved ✓</span>';
    setTimeout(() => el.textContent = '', 3000);
  } catch (e) {
    el.innerHTML = '<span class="err">' + escapeHtml(e.message) + '</span>';
  }
}

loadConfig();
</script>
{% endblock %}
