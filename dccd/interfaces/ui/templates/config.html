{% extends "base.html" %}
{% block title %}Config{% endblock %}
{% block content %}
<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:.5rem">
  <h1 style="margin:0">Config</h1>
  <div class="row" style="gap:.5rem">
    <button onclick="saveConfig()">Save</button>
    <button class="ghost" onclick="loadConfig()">Reload</button>
    <span id="save-status" style="font-size:.85rem"></span>
  </div>
</div>

<!-- Tabs -->
<div class="row" style="gap:0;margin-bottom:1rem;border-bottom:1px solid var(--border)">
  <button class="ghost" id="tab-form-btn" onclick="showTab('form')" style="border-radius:0;border-bottom:2px solid var(--accent);color:var(--fg)">Settings &amp; Jobs</button>
  <button class="ghost" id="tab-json-btn" onclick="showTab('json')" style="border-radius:0;border-bottom:2px solid transparent">Raw JSON</button>
</div>

<!-- Form view -->
<div id="tab-form">
  <h2>Settings</h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:.6rem;max-width:600px">
    <div>
      <label class="muted" style="font-size:.8rem">Data path</label>
      <input id="s-data-path" style="width:100%;margin-top:.2rem">
    </div>
    <div>
      <label class="muted" style="font-size:.8rem">Timezone</label>
      <input id="s-timezone" placeholder="local / UTC / Europe/Paris" style="width:100%;margin-top:.2rem">
    </div>
    <div>
      <label class="muted" style="font-size:.8rem">UI host</label>
      <input id="s-ui-host" style="width:100%;margin-top:.2rem">
    </div>
    <div>
      <label class="muted" style="font-size:.8rem">UI port</label>
      <input id="s-ui-port" type="number" style="width:100%;margin-top:.2rem">
    </div>
  </div>

  <h2 style="margin-top:1.5rem">Jobs <button onclick="addJob()" style="font-size:.75rem;padding:.2rem .5rem;margin-left:.5rem">+ Add</button></h2>
  <p class="muted" style="font-size:.85rem">Add and configure backfill and stream jobs. Each job runs on its configured schedule when <code>dccd start</code> is running.</p>

  <div id="jobs-form"></div>

  <h2 style="margin-top:1.5rem">Remote storage (rclone)</h2>
  <div id="remotes-form"></div>
  <button class="ghost" onclick="addRemote()" style="font-size:.8rem;margin-top:.4rem">+ Add remote</button>
</div>

<!-- Raw JSON -->
<div id="tab-json" style="display:none">
  <textarea id="cfg-editor" spellcheck="false" style="min-height:60vh;font-size:.82rem"></textarea>
</div>

<!-- Job template (hidden) -->
<template id="job-tpl">
  <div class="card" style="margin:.4rem 0;padding:.7rem" data-job-idx="">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem">
      <div>
        <label class="muted" style="font-size:.75rem">Exchange *</label>
        <select class="j-exchange" style="width:100%;margin-top:.15rem">
          <option>binance</option><option>coinbase</option><option>kraken</option>
          <option>bybit</option><option>okx</option><option>bitfinex</option><option>bitmex</option>
        </select>
      </div>
      <div>
        <label class="muted" style="font-size:.75rem">Data type *</label>
        <select class="j-dtype" style="width:100%;margin-top:.15rem" onchange="onTypeChange(this)">
          <option value="ohlc">OHLC</option>
          <option value="trades">Trades</option>
          <option value="orderbook">Order Book</option>
        </select>
      </div>
      <div>
        <label class="muted" style="font-size:.75rem">Operation</label>
        <select class="j-op" style="width:100%;margin-top:.15rem">
          <option value="backfill">Backfill (scheduled)</option>
          <option value="stream">Stream (live)</option>
        </select>
      </div>
      <div style="grid-column:span 2">
        <label class="muted" style="font-size:.75rem">Pairs * (one per line, e.g. BTC/USDT)</label>
        <textarea class="j-pairs" rows="2" style="width:100%;margin-top:.15rem;min-height:unset"></textarea>
      </div>
      <div>
        <label class="muted" style="font-size:.75rem">Span (s) — OHLC only</label>
        <input class="j-span" placeholder="e.g. 3600" style="width:100%;margin-top:.15rem">
      </div>
    </div>
    <div class="row" style="margin-top:.4rem;justify-content:flex-end">
      <button class="ghost danger" style="font-size:.75rem;padding:.2rem .5rem" onclick="removeJob(this)">Remove</button>
    </div>
  </div>
</template>
{% endblock %}
{% block scripts %}
<script>
let cfg = {};

function showTab(name) {
  const isJson = name === 'json';
  document.getElementById('tab-form').style.display = isJson ? 'none' : '';
  document.getElementById('tab-json').style.display = isJson ? '' : 'none';
  document.getElementById('tab-form-btn').style.borderBottomColor = isJson ? 'transparent' : 'var(--accent)';
  document.getElementById('tab-form-btn').style.color = isJson ? 'var(--muted)' : 'var(--fg)';
  document.getElementById('tab-json-btn').style.borderBottomColor = isJson ? 'var(--accent)' : 'transparent';
  document.getElementById('tab-json-btn').style.color = isJson ? 'var(--fg)' : 'var(--muted)';
  if (isJson) {
    // Sync form → JSON
    try { document.getElementById('cfg-editor').value = JSON.stringify(formToCfg(), null, 2); } catch (_) {}
  } else {
    // Sync JSON → form
    try { const j = JSON.parse(document.getElementById('cfg-editor').value); cfgToForm(j); } catch (_) {}
  }
}

function cfgToForm(c) {
  cfg = c;
  const s = c.settings || {};
  document.getElementById('s-data-path').value = s.data_path || './data/crypto';
  document.getElementById('s-timezone').value = s.timezone || 'local';
  document.getElementById('s-ui-host').value = s.ui_host || '127.0.0.1';
  document.getElementById('s-ui-port').value = s.ui_port || 8080;

  // Jobs
  const container = document.getElementById('jobs-form');
  container.innerHTML = '';
  for (const j of (c.jobs || [])) {
    addJob(j);
  }

  // Remotes
  const rc = document.getElementById('remotes-form');
  rc.innerHTML = '';
  for (const r of (c.storage?.remotes || [])) {
    addRemote(r);
  }
}

function formToCfg() {
  const data_path = document.getElementById('s-data-path').value.trim() || './data/crypto';
  const settings = {
    data_path,
    timezone: document.getElementById('s-timezone').value.trim() || 'local',
    ui_host:  document.getElementById('s-ui-host').value.trim() || '127.0.0.1',
    ui_port:  parseInt(document.getElementById('s-ui-port').value) || 8080,
  };

  const jobs = [];
  for (const card of document.querySelectorAll('[data-job-idx]')) {
    const pairs = card.querySelector('.j-pairs').value.trim().split('\n').map(p=>p.trim()).filter(Boolean);
    const dtype = card.querySelector('.j-dtype').value;
    const span = parseInt(card.querySelector('.j-span').value) || null;
    const op   = card.querySelector('.j-op').value;
    const job  = {
      exchange: card.querySelector('.j-exchange').value,
      pairs,
      data_type: dtype,
      operation: op,
      trigger_kind: op === 'stream' ? 'supervised' : 'interval',
    };
    if (dtype === 'ohlc' && span) job.span = span;
    if (op === 'backfill') job.every = span || 3600;
    jobs.push(job);
  }

  const remotes = [];
  for (const row of document.querySelectorAll('[data-remote-idx]')) {
    const remote = row.querySelector('.r-remote').value.trim();
    if (remote) remotes.push({ provider: 'rclone', remote });
  }

  return {
    settings,
    storage: { local_path: data_path, remotes, sync_interval: cfg.storage?.sync_interval || 3600 },
    alerts: cfg.alerts || {},
    jobs,
  };
}

let jobIdx = 0;
function addJob(data) {
  const tpl = document.getElementById('job-tpl').content.cloneNode(true);
  const card = tpl.querySelector('[data-job-idx]');
  card.dataset.jobIdx = jobIdx++;
  if (data) {
    card.querySelector('.j-exchange').value = data.exchange || 'binance';
    card.querySelector('.j-dtype').value    = data.data_type || 'ohlc';
    card.querySelector('.j-op').value       = data.operation || 'backfill';
    card.querySelector('.j-pairs').value    = (data.pairs || []).join('\n');
    card.querySelector('.j-span').value     = data.span || '';
  }
  document.getElementById('jobs-form').appendChild(tpl);
}
function removeJob(btn) { btn.closest('[data-job-idx]').remove(); }
function onTypeChange(sel) {
  const spanInput = sel.closest('[data-job-idx]').querySelector('.j-span');
  spanInput.disabled = sel.value !== 'ohlc';
}

let remoteIdx = 0;
function addRemote(data) {
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.remoteIdx = remoteIdx++;
  row.style.cssText = 'gap:.5rem;margin:.3rem 0';
  row.innerHTML = `<input class="r-remote" placeholder="remote:path/" style="flex:1" value="${escapeHtml((data||{}).remote||'')}">
    <button class="ghost" style="font-size:.8rem" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById('remotes-form').appendChild(row);
}

async function loadConfig() {
  try {
    const c = await api('GET', '/api/config');
    cfgToForm(c);
    document.getElementById('cfg-editor').value = JSON.stringify(c, null, 2);
    document.getElementById('save-status').innerHTML = '';
  } catch (e) {
    document.getElementById('save-status').innerHTML = '<span class="err">' + escapeHtml(e.message) + '</span>';
  }
}

async function saveConfig() {
  const el = document.getElementById('save-status');
  el.textContent = '';
  let data;
  // Check which tab is active
  if (document.getElementById('tab-json').style.display !== 'none') {
    try { data = JSON.parse(document.getElementById('cfg-editor').value); }
    catch (e) { el.innerHTML = '<span class="err">Invalid JSON: ' + escapeHtml(e.message) + '</span>'; return; }
  } else {
    data = formToCfg();
  }
  try {
    await api('PUT', '/api/config', data);
    el.innerHTML = '<span class="ok">Saved ✓</span>';
    // Reload to reflect any server-side normalization
    setTimeout(loadConfig, 300);
    setTimeout(() => el.textContent = '', 3500);
  } catch (e) {
    el.innerHTML = '<span class="err">' + escapeHtml(e.message) + '</span>';
  }
}

loadConfig();
</script>
{% endblock %}
