{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}
<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:.5rem">
  <h1 style="margin:0">Live events</h1>
  <div class="row" style="gap:.5rem">
    <button class="ghost" onclick="clearLog()">Clear</button>
    <span id="conn-status" class="muted">Connecting…</span>
  </div>
</div>
<p class="muted">Real-time progress, log, and status events from running jobs.
  Start a backfill from <a href="/inventory">Inventory</a> to see events here.</p>

<pre id="log-out" style="min-height:60vh">Waiting for events…
</pre>
{% endblock %}
{% block scripts %}
<script>
const logEl = document.getElementById('log-out');
const statusEl = document.getElementById('conn-status');
let es;
let eventCount = 0;

function clearLog() {
  logEl.textContent = 'Waiting for events…\n';
  eventCount = 0;
}

function connect() {
  if (es) es.close();
  es = new EventSource('/api/events');

  es.onopen = () => { statusEl.innerHTML = '<span class="ok">Connected</span>'; };

  es.onmessage = (e) => {
    if (e.data.startsWith(':')) return; // heartbeat comment
    try {
      const ev = JSON.parse(e.data);
      if (eventCount === 0) logEl.textContent = ''; // clear placeholder
      eventCount++;
      const ts = new Date().toISOString().slice(11, 19);
      let line = `[${ts}] `;
      if (ev.kind === 'progress') {
        line += `PROGRESS ${ev.run_id.split('@')[0]}  ${ev.done}/${ev.total} ${ev.unit}`;
      } else if (ev.kind === 'log') {
        line += `${ev.level.toUpperCase().padEnd(5)} ${ev.run_id.split('@')[0]} — ${ev.message}`;
      } else if (ev.kind === 'status') {
        line += `STATUS  ${ev.run_id.split('@')[0]} → ${ev.state}`;
      } else {
        line += e.data;
      }
      logEl.textContent += line + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    } catch (_) {
      logEl.textContent += e.data + '\n';
    }
  };

  es.onerror = () => {
    statusEl.innerHTML = '<span class="err">Disconnected — retrying…</span>';
    setTimeout(connect, 3000);
  };
}

connect();
</script>
{% endblock %}
