{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}
<h1>Logs</h1>
<p class="muted">Last 200 lines of <code>dccd.log</code>, refreshed every 5&nbsp;s.</p>
<pre id="log-pre" hx-get="/api/logs?tail=200" hx-trigger="load, every 5s"
     hx-swap="innerHTML"></pre>
{% endblock %}
{% block scripts %}
<script>
  document.body.addEventListener('htmx:afterSwap', function (e) {
    if (e.target.id !== 'log-pre') return;
    let data;
    try { data = JSON.parse(e.target.textContent); } catch (err) { return; }
    e.target.textContent = (data.lines || []).join('\n') || '(empty)';
    e.target.scrollTop = e.target.scrollHeight;
  });
</script>
{% endblock %}
