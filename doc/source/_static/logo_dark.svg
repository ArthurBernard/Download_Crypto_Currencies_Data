<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- Wick -->
  <line x1="100" y1="12" x2="100" y2="188"
        stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>

  <!-- Candle body: left half green, right half red -->
  <rect x="84" y="64" width="16" height="72" fill="#4ade80"/>
  <rect x="100" y="64" width="16" height="72" fill="#f87171"/>
  <!-- Body border -->
  <rect x="84" y="64" width="32" height="72"
        fill="none" stroke="#e2e8f0" stroke-width="4"/>

  <!-- Left arc -->
  <path d="M 100,24 A 60,60 0 0,0 100,176"
        fill="none" stroke="#e2e8f0" stroke-width="11" stroke-linecap="square"/>

  <!-- Right arc -->
  <path d="M 100,24 A 60,60 0 0,1 100,176"
        fill="none" stroke="#e2e8f0" stroke-width="11" stroke-linecap="square"/>

  <!-- ═══ Left network ═══ -->
  <circle cx="60" cy="100" r="6" fill="#e2e8f0"/>
  <line x1="60" y1="100" x2="22" y2="70"  stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="60" y1="100" x2="16" y2="100" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="60" y1="100" x2="26" y2="132" stroke="#e2e8f0" stroke-width="2.5"/>
  <circle cx="41" cy="85"  r="4.5" fill="#e2e8f0"/>
  <circle cx="38" cy="100" r="4.5" fill="#e2e8f0"/>
  <circle cx="43" cy="116" r="4.5" fill="#e2e8f0"/>
  <circle cx="22" cy="70"  r="9" fill="#4ade80"/>
  <circle cx="16" cy="100" r="9" fill="#4ade80"/>
  <circle cx="26" cy="132" r="7" fill="#e2e8f0"/>

  <!-- ═══ Right network ═══ -->
  <circle cx="140" cy="100" r="6" fill="#e2e8f0"/>
  <line x1="140" y1="100" x2="178" y2="70"  stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="140" y1="100" x2="184" y2="100" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="140" y1="100" x2="174" y2="132" stroke="#e2e8f0" stroke-width="2.5"/>
  <circle cx="159" cy="85"  r="4.5" fill="#e2e8f0"/>
  <circle cx="162" cy="100" r="4.5" fill="#e2e8f0"/>
  <circle cx="157" cy="116" r="4.5" fill="#e2e8f0"/>
  <circle cx="178" cy="70"  r="9" fill="#f87171"/>
  <circle cx="184" cy="100" r="9" fill="#f87171"/>
  <circle cx="174" cy="132" r="7" fill="#e2e8f0"/>

</svg>
