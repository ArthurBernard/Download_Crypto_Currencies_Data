<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- ═══ Connecting lines ═══ -->
  <line x1="40" y1="82"  x2="70" y2="92"  stroke="#e2e8f0" stroke-width="2"/>
  <line x1="40" y1="82"  x2="70" y2="112" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="40" y1="114" x2="70" y2="92"  stroke="#e2e8f0" stroke-width="2"/>
  <line x1="40" y1="114" x2="70" y2="112" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="47" y1="132" x2="70" y2="112" stroke="#e2e8f0" stroke-width="2"/>

  <line x1="160" y1="82"  x2="130" y2="92"  stroke="#e2e8f0" stroke-width="2"/>
  <line x1="160" y1="82"  x2="130" y2="112" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="160" y1="114" x2="130" y2="92"  stroke="#e2e8f0" stroke-width="2"/>
  <line x1="160" y1="114" x2="130" y2="112" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="153" y1="132" x2="130" y2="112" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ═══ Arcs ═══ -->
  <path d="M 100,27 A 60,60 0 0,0 100,173"
        fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="square"/>
  <path d="M 100,27 A 60,60 0 0,1 100,173"
        fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="square"/>

  <!-- ═══ Wick ═══ -->
  <line x1="100" y1="14" x2="100" y2="186"
        stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>

  <!-- ═══ Candle body ═══ -->
  <rect x="88" y="68" width="12" height="64" fill="#4ade80"/>
  <rect x="100" y="68" width="12" height="64" fill="#f87171"/>
  <rect x="88" y="68" width="24" height="64"
        fill="none" stroke="#e2e8f0" stroke-width="3.5"/>

  <!-- ═══ Left nodes ═══ -->
  <circle cx="40"  cy="82"  r="8" fill="#4ade80"/>
  <circle cx="40"  cy="114" r="8" fill="#4ade80"/>
  <circle cx="47"  cy="132" r="6" fill="#e2e8f0"/>
  <circle cx="70"  cy="92"  r="5" fill="#e2e8f0"/>
  <circle cx="70"  cy="112" r="5" fill="#e2e8f0"/>

  <!-- ═══ Right nodes ═══ -->
  <circle cx="160" cy="82"  r="8" fill="#f87171"/>
  <circle cx="160" cy="114" r="8" fill="#f87171"/>
  <circle cx="153" cy="132" r="6" fill="#e2e8f0"/>
  <circle cx="130" cy="92"  r="5" fill="#e2e8f0"/>
  <circle cx="130" cy="112" r="5" fill="#e2e8f0"/>

</svg>
