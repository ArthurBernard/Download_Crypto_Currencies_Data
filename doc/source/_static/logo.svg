<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="160" height="160">

  <!-- Wick vertical -->
  <line x1="100" y1="14" x2="100" y2="186" stroke="#2d3748" stroke-width="4" stroke-linecap="butt"/>

  <!-- Candle body: left half green, right half red -->
  <rect x="87" y="68" width="13" height="64" fill="#22c55e"/>
  <rect x="100" y="68" width="13" height="64" fill="#ef4444"/>
  <!-- Body border -->
  <rect x="87" y="68" width="26" height="64" fill="none" stroke="#2d3748" stroke-width="3"/>

  <!-- Left arc (opening right, flat ends) -->
  <path d="M 100,26 A 60,60 0 0,0 100,174"
        fill="none" stroke="#2d3748" stroke-width="6" stroke-linecap="square"/>
  <!-- Right arc (opening left, flat ends) -->
  <path d="M 100,26 A 60,60 0 0,1 100,174"
        fill="none" stroke="#2d3748" stroke-width="6" stroke-linecap="square"/>

  <!-- ═══ Left network ═══ -->
  <!-- Hub -->
  <circle cx="64" cy="100" r="4.5" fill="#2d3748"/>
  <!-- Lines hub → outer -->
  <line x1="64" y1="100" x2="26" y2="74"  stroke="#2d3748" stroke-width="2.2"/>
  <line x1="64" y1="100" x2="20" y2="100" stroke="#2d3748" stroke-width="2.2"/>
  <line x1="64" y1="100" x2="30" y2="128" stroke="#2d3748" stroke-width="2.2"/>
  <!-- Intermediate nodes (mid-line) -->
  <circle cx="45" cy="87"  r="3.5" fill="#2d3748"/>
  <circle cx="42" cy="100" r="3.5" fill="#2d3748"/>
  <circle cx="47" cy="114" r="3.5" fill="#2d3748"/>
  <!-- Outer nodes -->
  <circle cx="26" cy="74"  r="7" fill="#22c55e"/>
  <circle cx="20" cy="100" r="7" fill="#22c55e"/>
  <circle cx="30" cy="128" r="6" fill="#2d3748"/>

  <!-- ═══ Right network ═══ -->
  <!-- Hub -->
  <circle cx="136" cy="100" r="4.5" fill="#2d3748"/>
  <!-- Lines hub → outer -->
  <line x1="136" y1="100" x2="174" y2="74"  stroke="#2d3748" stroke-width="2.2"/>
  <line x1="136" y1="100" x2="180" y2="100" stroke="#2d3748" stroke-width="2.2"/>
  <line x1="136" y1="100" x2="170" y2="128" stroke="#2d3748" stroke-width="2.2"/>
  <!-- Intermediate nodes -->
  <circle cx="155" cy="87"  r="3.5" fill="#2d3748"/>
  <circle cx="158" cy="100" r="3.5" fill="#2d3748"/>
  <circle cx="153" cy="114" r="3.5" fill="#2d3748"/>
  <!-- Outer nodes -->
  <circle cx="174" cy="74"  r="7" fill="#ef4444"/>
  <circle cx="180" cy="100" r="7" fill="#ef4444"/>
  <circle cx="170" cy="128" r="6" fill="#2d3748"/>

</svg>
