<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- ═══ Connecting lines (drawn first, under everything) ═══ -->

  <!-- Left network: X-crossing pattern -->
  <line x1="40" y1="82"  x2="70" y2="92"  stroke="#2d3748" stroke-width="2"/>
  <line x1="40" y1="82"  x2="70" y2="112" stroke="#2d3748" stroke-width="2"/>
  <line x1="40" y1="114" x2="70" y2="92"  stroke="#2d3748" stroke-width="2"/>
  <line x1="40" y1="114" x2="70" y2="112" stroke="#2d3748" stroke-width="2"/>
  <line x1="47" y1="132" x2="70" y2="112" stroke="#2d3748" stroke-width="2"/>

  <!-- Right network: mirror -->
  <line x1="160" y1="82"  x2="130" y2="92"  stroke="#2d3748" stroke-width="2"/>
  <line x1="160" y1="82"  x2="130" y2="112" stroke="#2d3748" stroke-width="2"/>
  <line x1="160" y1="114" x2="130" y2="92"  stroke="#2d3748" stroke-width="2"/>
  <line x1="160" y1="114" x2="130" y2="112" stroke="#2d3748" stroke-width="2"/>
  <line x1="153" y1="132" x2="130" y2="112" stroke="#2d3748" stroke-width="2"/>

  <!-- ═══ Arcs (thick, square caps = horizontal ticks at wick) ═══ -->
  <path d="M 100,27 A 60,60 0 0,0 100,173"
        fill="none" stroke="#2d3748" stroke-width="12" stroke-linecap="square"/>
  <path d="M 100,27 A 60,60 0 0,1 100,173"
        fill="none" stroke="#2d3748" stroke-width="12" stroke-linecap="square"/>

  <!-- ═══ Wick (on top of arcs) ═══ -->
  <line x1="100" y1="14" x2="100" y2="186"
        stroke="#2d3748" stroke-width="4" stroke-linecap="round"/>

  <!-- ═══ Candle body ═══ -->
  <rect x="88" y="68" width="12" height="64" fill="#22c55e"/>
  <rect x="100" y="68" width="12" height="64" fill="#ef4444"/>
  <rect x="88" y="68" width="24" height="64"
        fill="none" stroke="#2d3748" stroke-width="3.5"/>

  <!-- ═══ Left network nodes (on top of everything) ═══ -->
  <circle cx="40"  cy="82"  r="8" fill="#22c55e"/>
  <circle cx="40"  cy="114" r="8" fill="#22c55e"/>
  <circle cx="47"  cy="132" r="6" fill="#2d3748"/>
  <circle cx="70"  cy="92"  r="5" fill="#2d3748"/>
  <circle cx="70"  cy="112" r="5" fill="#2d3748"/>

  <!-- ═══ Right network nodes ═══ -->
  <circle cx="160" cy="82"  r="8" fill="#ef4444"/>
  <circle cx="160" cy="114" r="8" fill="#ef4444"/>
  <circle cx="153" cy="132" r="6" fill="#2d3748"/>
  <circle cx="130" cy="92"  r="5" fill="#2d3748"/>
  <circle cx="130" cy="112" r="5" fill="#2d3748"/>

</svg>
