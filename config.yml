# dccd daemon — minutely OHLC + orderbook for Binance, Kraken, Bybit
#
# Phase 1 — initial backfill (run once):
#   python scripts/backfill.py
#
# Phase 2 — continuous collection:
#   dccd validate --config config.yml
#   dccd start   --config config.yml
#
# Status check:
#   dccd status  --config config.yml

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
storage:
  local_path: /data/crypto

  # Optional: sync to NAS/S3/etc. via rclone after each cycle.
  # Comment out the entire 'remotes' block to keep data local only.
  # remotes:
  #   - provider: rclone
  #     remote: "mynas:crypto/"

  sync_interval: 3600   # 0 to disable remote sync


# ---------------------------------------------------------------------------
# Historical OHLC — REST polling (minutely candles)
# ---------------------------------------------------------------------------
# Each job fetches the candles added since the last run.
# Interval = span, so a span=60 job runs every minute.
histo_jobs:

  - exchange: binance
    pairs:
      - BTC/USDT
      - ETH/USDT
    span: 60
    format: parquet
    by_period: M

  - exchange: kraken
    pairs:
      - BTC/USD
      - ETH/USD
    span: 60
    format: parquet
    by_period: M

  - exchange: bybit
    pairs:
      - BTC/USDT
      - ETH/USDT
    span: 60
    format: parquet
    by_period: M


# ---------------------------------------------------------------------------
# Real-time orderbook + trades — WebSocket streaming
# ---------------------------------------------------------------------------
# One persistent WebSocket connection per pair; book snapshot saved every
# time_step seconds.
stream_jobs:

  - exchange: binance
    pairs:
      - BTC/USDT
      - ETH/USDT
    channels:
      - trades
      - book
    time_step: 60

  - exchange: kraken
    pairs:
      - BTC/USD
      - ETH/USD
    channels:
      - trades
      - book
    time_step: 60

  - exchange: bybit
    pairs:
      - BTC/USDT
      - ETH/USDT
    channels:
      - trades
      - book
    time_step: 60


# ---------------------------------------------------------------------------
# Alerts (optional)
