[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dccd"
version = "3.0.0"
description = "Download Crypto Currency Data — hexagonal architecture, async-first."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arthur Bernard", email = "arthur.bernard.92@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.0",
    "polars>=0.20",
    "pyarrow>=13",
    "numpy>=1.26",
    "scipy>=1.10",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
daemon = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "tqdm>=4.64",
    "uvicorn[standard]>=0.29",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "apscheduler>=3.10,<4",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "interrogate>=1.5",
    "mypy>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tqdm>=4.64",
    "uvicorn[standard]>=0.29",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
]
doc = [
    "sphinx>=7.0",
    "furo",
    "numpydoc",
    "sphinx-design",
    "sphinx-copybutton",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
]

[project.scripts]
dccd = "dccd.interfaces.cli.main:app"

[project.urls]
Homepage = "https://github.com/ArthurBernard/Download_Crypto_Currencies_Data"
Documentation = "https://download-crypto-currencies-data.readthedocs.io/"
Changelog = "https://github.com/ArthurBernard/Download_Crypto_Currencies_Data/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["dccd*"]

[tool.setuptools.package-data]
"dccd.interfaces.ui" = ["templates/*.html", "templates/partials/*.html", "static/*"]
"dccd.daemon.ui" = ["templates/*.html", "templates/partials/*.html", "static/*"]

[tool.pytest.ini_options]
addopts = "--exitfirst -vv --capture=no --ignore=doc --ignore=examples --ignore=env --cov=dccd --cov-report=term-missing --ignore=dccd/tests"
testpaths = ["dccd/tests/v3", "dccd/domain", "dccd/storage", "dccd/application"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"dccd/**/__init__.py" = ["F401", "F403", "F405"]
"dccd/__init__.py" = ["F401", "F403", "F405"]

[tool.coverage.run]
omit = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disable_error_code = ["import-untyped"]
exclude = ["dccd/tests/", "dccd/histo_dl/", "dccd/continuous_dl/", "dccd/daemon/"]

[[tool.mypy.overrides]]
module = ["dccd.domain.*"]
strict = true
warn_return_any = true

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
fail-under = 80
exclude = ["dccd/tests"]
